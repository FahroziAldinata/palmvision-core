name: Core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-core:
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: palmvision_core
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000

      tileserv:
        image: pramsey/pg_tileserv:latest
        env:
          DATABASE_URL: postgresql://sail:password@127.0.0.1:5432/palmvision_core
        ports:
          - 7800:7800

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, redis, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Pint (Code Style Check)
        run: ./vendor/bin/pint --test

      - name: Run Larastan (Static Analysis Level 6)
        run: ./vendor/bin/phpstan analyse

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Checkout Forecasting Service
        uses: actions/checkout@v4
        with:
          repository: FahroziAldinata/palmvision-forecasting
          path: /tmp/palmvision-forecasting

      - name: Build & Run Forecasting Service
        run: |
          docker build -t palmvision-forecasting /tmp/palmvision-forecasting
          docker run -d --name forecasting -p 8000:8000 -e API_KEY=palmvision-dev-key palmvision-forecasting
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q "ok"; then
              echo "Forecasting service is ready!"
              break
            fi
            echo "Waiting for forecasting service... ($i/30)"
            sleep 1
          done

      - name: Run Database Migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: palmvision_core
          DB_USERNAME: sail
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan migrate --force

      - name: Run Pest Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: palmvision_core
          DB_USERNAME: sail
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          GOTENBERG_URL: http://127.0.0.1:3000
          TILESERV_URL: http://127.0.0.1:7800
          FORECASTING_URL: http://127.0.0.1:8000
          FORECASTING_API_KEY: palmvision-dev-key
        run: php artisan test --exclude-group=external
